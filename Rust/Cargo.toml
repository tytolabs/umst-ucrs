[package]
name = "umst-ucrs"
version = "1.0.0"
edition = "2021"
authors = [
    "Santhosh Shyamsundar <santhosh@studiotyto.com>",
    "Santosh Prabhu Shenbagamoorthy <santosh@studiotyto.com>",
]
description = "P2P thermodynamic clock synchronization daemon with Landauer-optimal credit system"
license = "MIT"
repository = "https://github.com/tytolabs/umst-ucrs"

# Not a nested `[workspace]` — tyto-workspace root does not list this crate as a member.
# Build standalone: `cargo build --manifest-path umst-ucrs/Rust/Cargo.toml`

[lib]
name = "umst_ucrs"
path = "src/lib.rs"

[[bin]]
name = "umst-ucrs"
path = "src/main.rs"

[[bin]]
name = "umst-ucrs-p2p"
path = "src/bin/p2p.rs"
required-features = ["p2p"]

[features]
# Default keeps compile-time small so downstream consumers don't pull libp2p.
default = []
# A7-4 multi-information global coordination cost (`landauer_global`).
a7-4 = []
# Enable libp2p-backed P2P swarm (daemon only).
p2p = ["dep:libp2p", "dep:futures"]
# Expose Prometheus HTTP scrape endpoint (`:9090/metrics`).
prometheus = []
# Daemon profile: metrics server + async agent loop (implies prometheus).
daemon = ["prometheus"]

[dependencies]
clap = { version = "4", features = ["derive"] }
pqcrypto-dilithium = "0.5.0"
pqcrypto-kyber = "0.8.1"
pqcrypto-sphincsplus = "0.7.2"
pqcrypto-traits = "0.3.5"
sha3 = "0.10.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3", optional = true }
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "mdns", "gossipsub", "tokio", "macros"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.13"
# U1 — Clausius–Duhem SSOT (`clausius_duhem_admissible`); path pinned via `.umst-pins.toml` in CI.
umst-math = { version = "0.1.0", path = "../../umst-manifold/umst-math" }
# S-Q4 — Trust ADT wire projection SSOT (`umst_algebra::crypto::trust` via thin crate).
umst-trust = { version = "0.1.0", path = "../../umst-foundations/crates/umst-trust" }
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# S-0 — ε-bisim parity tests vs `umst-math` (SSOT: `umst-manifold/umst-math`).
umst-math = { version = "0.1.0", path = "../../umst-manifold/umst-math" }
# S-0 — deepen ucrs↔algebra reference parity (SEC-UCRS-PARITY; does not replace math SSOT).
# OP5A-PARITY-RELOC: unidirectional dev edge (ucrs → algebra). Former algebra → ucrs
# edge breaks when parity tests live under `Rust/tests/` (see §3.2.1 in SSOT below).
# SSOT: docs/OP5_EXCEPTION_UMST_ALGEBRA.md §3.2.1 / §3.3.
umst-algebra = { version = "0.1.0", path = "../../umst-foundations/crates/umst-algebra", default-features = false }
[[bench]]
name = "sync_cost_bench"
harness = false

[[test]]
name = "s0_crypto_ucrs_parity"
path = "tests/s0_crypto_ucrs_parity.rs"

[[test]]
name = "s0_crypto_ucrs_algebra_parity"
path = "tests/s0_crypto_ucrs_algebra_parity.rs"

[[test]]
name = "s0_kat_reference_parity"
path = "tests/s0_kat_reference_parity.rs"

[[test]]
name = "s1_trust_ucrs_wire_parity"
path = "tests/s1_trust_ucrs_wire_parity.rs"

[[test]]
name = "gate_cd_drift_fixture"
path = "tests/gate_cd_drift_fixture.rs"

[[test]]
name = "gossip_cycle"
path = "tests/gossip_cycle.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ucrs_skip_powermetrics)'] }
