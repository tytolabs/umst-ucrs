# SPDX-FileCopyrightText: 2026 Santosh Prabhu Shenbagamoorthy and Santhosh Shyamsundar
# SPDX-License-Identifier: MIT
[package]
name = "umst-ucrs"
version = "1.0.0"
edition = "2021"
authors = [
    "Santhosh Shyamsundar <santhosh@studiotyto.com>",
    "Santosh Prabhu Shenbagamoorthy <santosh@studiotyto.com>",
]
description = "P2P thermodynamic clock synchronization daemon with Landauer-optimal credit system"
# UCRS-URGE-GOSSIP-COMPOSE cycle fence: umst-urge path-depends on umst-ucrs;
# reverse compose is census/citation in gossip_mesh_census.rs — no umst-urge dep here.
license = "MIT"
repository = "https://github.com/tytolabs/umst-ucrs"

# Not a nested `[workspace]` — tyto-workspace root does not list this crate as a member.
# Build standalone: `cargo build --manifest-path umst-ucrs/Rust/Cargo.toml`

[lib]
name = "umst_ucrs"
path = "src/lib.rs"

[[bin]]
name = "umst-ucrs"
path = "src/main.rs"

[[bin]]
name = "umst-ucrs-p2p"
path = "src/bin/p2p.rs"
required-features = ["p2p"]

[features]
# Default is public-ladder safe (W-63): no private umst-foundations path deps.
# Local / foundations CI job: `--features foundations-ssot`.
default = []
# W-63 — parity vs umst-foundations runs in tyto-workspace (no private path deps here).
foundations-ssot = []
# A7-4 multi-information global coordination cost (`landauer_global`).
a7-4 = []
# Enable libp2p-backed P2P swarm (daemon only).
p2p = ["dep:libp2p", "dep:futures"]
# Expose Prometheus HTTP scrape endpoint (`:9090/metrics`).
prometheus = []
# Daemon profile: metrics server + async agent loop (implies prometheus).
daemon = ["prometheus"]

[dependencies]
clap = { version = "4", features = ["derive"] }
pqcrypto-dilithium = "0.5.0"
pqcrypto-kyber = "0.8.1"
pqcrypto-sphincsplus = "0.7.2"
pqcrypto-traits = "0.3.5"
sha3 = "0.10.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3", optional = true }
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "mdns", "gossipsub", "tokio", "macros"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = { version = "0.14", default-features = false }  # text exposition only: no protobuf (RUSTSEC-2024-0437)
# U1 — Clausius–Duhem SSOT (`clausius_duhem_admissible`); path pinned via `.umst-pins.toml` in CI.
umst-math = { version = "0.1.0", path = "../../umst-manifold/umst-math" }
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# S-0 — ε-bisim parity tests vs `umst-math` (SSOT: `umst-manifold/umst-math`).
umst-math = { version = "0.1.0", path = "../../umst-manifold/umst-math" }
[[bench]]
name = "sync_cost_bench"
harness = false

[[test]]
name = "s0_crypto_ucrs_parity"
path = "tests/crypto_ucrs_parity.rs"
required-features = ["foundations-ssot"]

[[test]]
name = "s0_crypto_ucrs_algebra_parity"
path = "tests/crypto_ucrs_algebra_parity.rs"
required-features = ["foundations-ssot"]

[[test]]
name = "s0_kat_reference_parity"
path = "tests/kat_reference_parity.rs"
required-features = ["foundations-ssot"]

[[test]]
name = "s1_trust_ucrs_wire_parity"
path = "tests/trust_ucrs_wire_parity.rs"
required-features = ["foundations-ssot"]

[[test]]
name = "gate_cd_drift_fixture"
path = "tests/gate_cd_drift_fixture.rs"

[[test]]
name = "gossip_cycle"
path = "tests/gossip_cycle.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ucrs_skip_powermetrics)', 'cfg(feature, values("foundations-ssot"))'] }
