name: Lean

on:
  push:
    branches: [main, master, docs/reorganize-readme]
  pull_request:
    branches: [main, master, docs/reorganize-readme]

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lean
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          build: false
      - name: Build the runtime contract at the pinned umst-formal commit (no error, warning or sorry)
        run: |
          set -o pipefail
          lake build 2>&1 | tee /tmp/lake.log
          if grep -E "^(warning|error)" /tmp/lake.log | grep -v "\.lake/packages/"; then exit 1; fi
          if grep -q "declaration uses 'sorry'" /tmp/lake.log; then exit 1; fi
